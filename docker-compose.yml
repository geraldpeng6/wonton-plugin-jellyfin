services:
  prepare:
    # Jellyfin 12.4 的实际配置目录是 /config/config，不是 /config。
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "-ec", "mkdir -p /data/config && test -e /data/config/system.xml || install -m 0644 /seed/system.xml /data/config/system.xml"]
    volumes:
      - ${WONTON_APP_DATA}/config:/data
    configs:
      - source: system_config
        target: /seed/system.xml
    network_mode: none
    restart: "no"

  jellyfin:
    depends_on:
      prepare:
        condition: service_completed_successfully
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    # Jellyfin 12.4 官方多架构清单摘要；不启用转码显卡、DLNA 或局域网端口。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: ${WONTON_APP_URL}
    volumes:
      - ${WONTON_APP_DATA}/config:/config
      - ${WONTON_APP_DATA}/cache:/cache
      - ${WONTON_SHARE_MEDIA}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "localhost", "-Lk", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
      start_interval: 2s

configs:
  system_config:
    file: config/system.xml

x-wonton:
  spec: "0.4"
  id: org.jellyfin.media
  version: 0.1.0
  kind: app
  title: { en: Jellyfin }
  description:
    zh: 管理和播放共享文件夹里的电影、剧集和音乐
    en: Manage and stream movies, shows and music from your shared folder
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://jellyfin.org
  license: GPL-2.0-only
  tags:
    zh: [视频, 音乐]
    en: [Video, Music]
  about:
    zh: |
      Jellyfin 把共享文件夹里的电影、剧集和音乐整理成网页媒体库，支持扫描、检索和在线播放。

      配置、缓存和媒体库元数据放在插件自己的数据目录；共享文件夹只读，不会被 Jellyfin 修改。

      首次打开需要完成 Jellyfin 自己的初始化向导并创建管理员；插件预置中文元数据，网页界面语言跟随浏览器语言，但不会写默认密码。
    en: |
      Jellyfin turns the movies, shows and music in your shared folder into a web media library for scanning, browsing and streaming.

      Configuration, cache and library metadata stay in the plugin data directory; the shared folder is read-only and Jellyfin does not modify it.

      The first opening requires Jellyfin's own setup wizard to create an administrator. The plugin preselects Chinese metadata; the web UI language follows the browser language. No default password is written.
  release_notes: { zh: 首次发布 Jellyfin 12.4 插件。, en: First Jellyfin 12.4 plugin release. }
  webui:
    service: jellyfin
    port: 8096
    sso: none
  permissions:
    - storage.share.media:read
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 2G
